# ============================================================
# Blender-on-Android CI build (Phase 0: reproduce v0.0.3 build)
# Fork of dshawshank/APP-android_arm64 + epai's Gitea repos
#
# Job1: cross-compile all Blender static libs (bf_*.a) with NDK
#       - uses qemu-user + binfmt to run arm64 DNA/RNA generators
#         natively on the x86_64 runner (no phone hack needed)
# Job2: link OBlender APK from libbf_*.a + prebuilt .so libs
#
# Trigger: manual (workflow_dispatch) or push to main
# ============================================================
name: Blender Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  BLENDER_SRC: https://projects.blender.org/epai/Blender-android_arm64.git
  BLENDER_BRANCH: blender-v3.6-release
  LIB_SRC: https://projects.blender.org/epai/lib-android_arm64.git
  NDK_VER: r21d
  NDK_FULL: 21.4.7075529

jobs:
  build-libs:
    name: "1/2 Cross-compile Blender libs"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout APP fork (for BlenderLibNames target list)
        uses: actions/checkout@v4

      - name: Checkout Blender source fork (shallow)
        run: |
          git clone --depth=1 --single-branch --branch ${{ env.BLENDER_BRANCH }} ${{ env.BLENDER_SRC }} blender
          echo "blender source size: $(du -sh blender | cut -f1)"

      - name: Checkout prebuilt third-party libs (shallow)
        run: |
          git clone --depth=1 ${{ env.LIB_SRC }} lib-android_arm64
          echo "lib size: $(du -sh lib-android_arm64 | cut -f1)"

      - name: Install qemu-user (run arm64 generators on x86_64)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64 || true
          sudo update-binfmts --import || true
          # verify registration, manual register as fallback
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo "binfmt not registered, trying manual register"
            echo ':qemu-aarch64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xa8\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-aarch64-static:F' | sudo tee /proc/sys/fs/binfmt_misc/register > /dev/null || echo "MANUAL REGISTER FAILED"
          fi
          ls /proc/sys/fs/binfmt_misc/ | grep -i qemu || echo "NO QEMU BINFMT"
          /usr/bin/qemu-aarch64-static --version | head -1

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /opt/android-ndk-${{ env.NDK_VER }}
          key: ndk-${{ env.NDK_VER }}-linux-x86_64

      - name: Install NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL -o ndk.zip https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VER }}-linux-x86_64.zip
          sudo unzip -q ndk.zip -d /opt
          rm -f ndk.zip

      - name: Patch hardcoded Windows paths (global, all cmake files)
        run: |
          # The author hard-coded D:/FreeProjects/... in the root CMakeLists AND
          # in Find*.cmake modules (PYTHON_INCLUDE_DIR etc). Patch them all.
          FILES=$(grep -rl 'D:/FreeProjects/Blender/Blender/' blender \
            --include='*.cmake' --include='CMakeLists.txt' --include='*.txt' || true)
          echo "patched files: $(echo "$FILES" | wc -l)"
          for f in $FILES; do
            sed -i 's|D:/FreeProjects/Blender/Blender/|'$GITHUB_WORKSPACE'/|g' "$f"
          done
          echo "--- leftover windows refs in source tree:"
          grep -rc 'D:/FreeProjects' blender --include='*.cmake' --include='CMakeLists.txt' 2>/dev/null | grep -v ':0' | head || echo "none"
          # FindOpenCOLLADA.cmake uses a SECOND windows prefix with backslashes:
          #   F:\\FreeProjects\\android\\OpenCOLLADA-main\\COLLADABaseUtils\\include\\
          # -> rewrite to the libs checkout (lib-android_arm64/OpenCOLLADA/include/).
          python3 - <<'EOF'
          import os
          ws = os.environ['GITHUB_WORKSPACE']
          pat = 'F:\\\\FreeProjects\\\\android\\\\'
          repl = ws + '/lib-android_arm64/OpenCOLLADA/include/'
          total = 0
          for root, dirs, fs in os.walk('blender'):
              if '/.git' in root:
                  continue
              for f in fs:
                  if f.endswith('.cmake') or f == 'CMakeLists.txt':
                      p = os.path.join(root, f)
                      txt = open(p, encoding='utf-8', errors='replace').read()
                      n = txt.count(pat)
                      if n:
                          open(p, 'w', encoding='utf-8').write(txt.replace(pat, repl))
                          print('fixed', p, n)
                          total += n
          print('total F: refs fixed:', total)
          EOF
          # author's FindPythonLibs.cmake joins cpython/include/include (wrong, the
          # cpython here is a full source tree: Python.h lives in include/Include).
          # Fix the join so find_package() sets a valid PYTHON_INCLUDE_DIR.
          grep -rl 'cpython/include/include' blender --include='*.cmake' 2>/dev/null | while read f; do
            sed -i 's|cpython/include/include|cpython/include/Include|g' "$f"
            echo "fixed python include join in: $f"
          done
          # libpng in the libs repo ships its source tree but not the generated
          # pnglibconf.h -> use the prebuilt one from scripts/
          PNGDIR=lib-android_arm64/Png/include/libpng-1.6.40
          if [ ! -f "$PNGDIR/pnglibconf.h" ] && [ -f "$PNGDIR/scripts/pnglibconf.h.prebuilt" ]; then
            cp "$PNGDIR/scripts/pnglibconf.h.prebuilt" "$PNGDIR/pnglibconf.h"
            echo "pnglibconf.h: created from prebuilt"
          fi
          # datatoc_icon links against libpng16.so / libzlib.so which cannot be
          # statically linked; build static zlib + libpng with the NDK and point
          # datatoc_icon at them instead, so it links + runs under qemu natively.
          # NOTE: Png/include/libpng-1.6.40 in the libs repo is headers-only
          # (no png.c) -> use the official libpng source tarball.
          curl -fL -o zlib.tar.gz https://github.com/madler/zlib/archive/refs/tags/v1.2.13.tar.gz
          tar xzf zlib.tar.gz
          cmake -S zlib-1.2.13 -B zbuild -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/opt/android-ndk-${{ env.NDK_VER }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release
          ninja -C zbuild zlibstatic || { echo "ZLIB STATIC BUILD FAILED"; exit 1; }
          ls -la zbuild/libz.a
          # zconf.h is generated by CMake into zbuild/; libpng includes
          # zlib-1.2.13/zlib.h which does #include "zconf.h" -> copy it next
          # to zlib.h so the include resolves (z_size_t etc. get defined).
          cp zbuild/zconf.h zlib-1.2.13/zconf.h
          ls -la zlib-1.2.13/zconf.h
          curl -fL -o libpng.tar.gz https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.40.tar.gz
          tar xzf libpng.tar.gz
          cmake -S libpng-1.6.40 -B pbuild -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/opt/android-ndk-${{ env.NDK_VER }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPNG_SHARED=OFF -DPNG_STATIC=ON -DPNG_TESTS=OFF -DPNG_TOOLS=OFF \
            -DZLIB_LIBRARY=$GITHUB_WORKSPACE/zbuild/libz.a \
            -DZLIB_INCLUDE_DIR=$GITHUB_WORKSPACE/zlib-1.2.13
          ninja -C pbuild png_static || { echo "LIBPNG STATIC BUILD FAILED"; exit 1; }
          ls -la pbuild/libpng.a
          sed -i "s|target_link_libraries(datatoc_icon \${PNG_LIBRARIES} \${ZLIB_LIBRARIES})|target_link_libraries(datatoc_icon $GITHUB_WORKSPACE/pbuild/libpng.a $GITHUB_WORKSPACE/zbuild/libz.a)|" \
            blender/source/blender/datatoc/CMakeLists.txt
          grep -n 'target_link_libraries(datatoc_icon' blender/source/blender/datatoc/CMakeLists.txt

      - name: Ensure DNA/RNA generator commands are enabled
        run: |
          # Author commented out the generator executable + custom commands in the
          # intern/CMakeLists.txt (Windows phone-hack flow). On Linux CI we run the
          # arm64 generators via qemu, so restore the official flow:
          # makesdna: add_executable + add_custom_command (comment out STATIC lib twin)
          MD=blender/source/blender/makesdna/intern/CMakeLists.txt
          MR=blender/source/blender/makesrna/intern/CMakeLists.txt
          sed -i 's|^#add_executable(makesdna|add_executable(makesdna|' $MD
          sed -i '/^add_library(makesdna STATIC/,/SRC})/s/^/#/' $MD
          sed -i 's|^#add_executable(makesrna|add_executable(makesrna|' $MR
          sed -i '/^add_library(makesrna STATIC/,/SRC})/s/^/#/' $MR
          # un-comment the whole add_custom_command(...) block (multi-line)
          sed -i '/^#add_custom_command(/,/^#)$/s/^#//' $MD $MR
          # Generators are dynamically linked against Android's /system/bin/linker64,
          # which does not exist on this Linux runner. Statically link them so qemu
          # can run them directly.
          echo 'set_target_properties(makesdna PROPERTIES LINK_FLAGS "-static")' >> $MD
          echo 'set_target_properties(makesrna PROPERTIES LINK_FLAGS "-static")' >> $MR
          # Same issue affects every build-time tool (datatoc, datatoc_icon,
          # smaa_areatex, msgfmt, ...). Set the global EXE linker flag AFTER
          # project() (the NDK toolchain resets it inside project()) but BEFORE
          # add_subdirectory (subdirs snapshot vars by value).
          sed -i '/^project(Blender)/a set(CMAKE_EXE_LINKER_FLAGS "${CMAKE_EXE_LINKER_FLAGS} -static")' blender/CMakeLists.txt
          grep -n 'project(Blender)\|CMAKE_EXE_LINKER_FLAGS' blender/CMakeLists.txt | head -5
          # belt & braces: force -static on the known build-time tools
          echo 'set_target_properties(smaa_areatex PROPERTIES LINK_FLAGS "-static")' >> blender/extern/smaa_areatex/CMakeLists.txt
          echo 'set_target_properties(datatoc PROPERTIES LINK_FLAGS "-static")' >> blender/source/blender/datatoc/CMakeLists.txt
          echo 'set_target_properties(datatoc_icon PROPERTIES LINK_FLAGS "-static")' >> blender/source/blender/datatoc/CMakeLists.txt
          echo "=== after patch ==="
          grep -n 'add_executable\|add_library\|add_custom_command' $MD $MR | head -20

      - name: Configure with CMake + NDK toolchain
        run: |
          # author's FindPythonLibs.cmake points at a wrong include/include path;
          # cpython here is a full CPython source tree: Python.h lives in include/Include
          echo "PYTHON_INCLUDE_DIR=$GITHUB_WORKSPACE/lib-android_arm64/cpython/include/Include"
          cmake -S blender -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=/opt/android-ndk-${{ env.NDK_VER }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_MAKE_PROGRAM=$(command -v ninja) \
            -DPYTHON_INCLUDE_DIR=$GITHUB_WORKSPACE/lib-android_arm64/cpython/include/Include \
            -DPYTHON_LIBRARY=$GITHUB_WORKSPACE/lib-android_arm64/cpython/lib/libcpython.so \
            -DPYTHON_VERSION=3.11
          echo "=== configure done, targets: $(ninja -C build -t targets | wc -l)"

      - name: Extract BlenderLibNames target list from OBlender CMakeLists
        id: targets
        run: |
          python3 - <<'EOF'
          import re
          txt = open('OBlender/app/src/main/cpp/CMakeLists.txt').read()
          m = re.search(r'SET\(BlenderLibNames(.*?)\)\s*\n', txt, re.S)
          body = m.group(1)
          # strip comments and whitespace, keep identifiers
          body = re.sub(r'#.*', '', body)
          names = re.findall(r'\b(bf_[A-Za-z0-9_]+|makesdna|makesrna)\b', body)
          seen, out = set(), []
          for n in names:
              if n not in seen:
                  seen.add(n); out.append(n)
          print('TARGETS=' + ' '.join(out))
          print('COUNT=' + str(len(out)))
          EOF

      - name: Build all Blender static libs (j2, budget ~5h)
        run: |
          # load TARGETS from python output
          TARGETS=$(python3 - <<'EOF'
          import re
          txt = open('OBlender/app/src/main/cpp/CMakeLists.txt').read()
          m = re.search(r'SET\(BlenderLibNames(.*?)\)\s*\n', txt, re.S)
          body = re.sub(r'#.*', '', m.group(1))
          names = re.findall(r'\b(bf_[A-Za-z0-9_]+|makesdna|makesrna)\b', body)
          seen, out = set(), []
          for n in names:
              if n not in seen:
                  seen.add(n); out.append(n)
          print(' '.join(out))
          EOF
          )
          echo "targets: $(echo $TARGETS | wc -w)"
          ninja -C build -j2 $TARGETS
          echo "=== build done ==="

      - name: Collect static libs + generated headers
        run: |
          ls -la build/lib/ | head -30
          echo "lib count: $(ls build/lib/libbf_*.a 2>/dev/null | wc -l)"
          tar czf blender-libs.tgz \
            build/lib/libbf_*.a \
            $(find build -name 'dna*.h' -o -name 'rna*.h' -o -name 'dna.c' -o -name 'dna_verify.c' -o -name 'rna_xr_gen.c' | head -200) 2>/dev/null || true
          ls -lh blender-libs.tgz

      - name: Upload blender static libs
        uses: actions/upload-artifact@v4
        with:
          name: blender-libs
          path: blender-libs.tgz
          retention-days: 14

  build-apk:
    name: "2/2 Package OBlender APK"
    needs: build-libs
    runs-on: ubuntu-latest
    env:
      # use the runner's preinstalled SDK (sdkmanager included); runner
      # context is unavailable in job-level env, path is fixed on ubuntu-latest
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout APP fork
        uses: actions/checkout@v4

      - name: Download blender static libs
        uses: actions/download-artifact@v4
        with:
          name: blender-libs
          path: libs-dl

      - name: Clone prebuilt third-party libs (.so for jniLibs)
        run: |
          git clone --depth=1 ${{ env.LIB_SRC }} lib-android_arm64

      - name: Checkout Blender source fork (headers for native build)
        run: |
          git clone --depth=1 --single-branch --branch ${{ env.BLENDER_BRANCH }} ${{ env.BLENDER_SRC }} Blender-android_arm64
          echo "blender source size: $(du -sh Blender-android_arm64 | cut -f1)"

      - name: Setup JDK 11 (Gradle 6.5 / AGP 4.1.1 requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Android SDK bits (platform 30 + build-tools 30.0.3 + NDK)
        run: |
          # The runner preinstalls the SDK at /usr/local/lib/android/sdk
          # (root-owned). Just add the packages the OBlender build needs.
          ls $ANDROID_SDK_ROOT
          ls $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/ | head -5
          yes | sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "platform-tools" \
            "ndk;${{ env.NDK_FULL }}" > /dev/null
          ls $ANDROID_SDK_ROOT/ndk/

      - name: Patch OBlender CMakeLists (paths + lib dir)
        run: |
          CM=OBlender/app/src/main/cpp/CMakeLists.txt
          sed -i 's|D:/FreeProjects/Blender/Blender/|'$GITHUB_WORKSPACE'/|g' $CM
          # static libs live in build/lib of the libs job -> point there.
          # The original path may be absolute (already rewritten to
          # $GITHUB_WORKSPACE/Utilities-...) or relative (Utilities-...),
          # handle both to avoid a duplicated $GITHUB_WORKSPACE prefix.
          sed -i 's|'$GITHUB_WORKSPACE'/Utilities-android_arm64/MakeBlender/app/.cxx/cmake/release/arm64-v8a/lib|'$GITHUB_WORKSPACE'/blender-libs|g' $CM
          sed -i 's|Utilities-android_arm64/MakeBlender/app/.cxx/cmake/release/arm64-v8a/lib|'$GITHUB_WORKSPACE'/blender-libs|g' $CM
          # generated headers dir (dna/rna) - original points at the Windows
          # .cxx/.../source/creator; rewrite to the collected gen dir.
          sed -i 's|'$GITHUB_WORKSPACE'/Utilities-android_arm64/MakeBlender/app/.cxx/cmake/release/arm64-v8a/source/creator|'$GITHUB_WORKSPACE'/blender-libs-gen|g' $CM
          sed -i 's|Utilities-android_arm64/MakeBlender/app/.cxx/cmake/release/arm64-v8a/source/creator|'$GITHUB_WORKSPACE'/blender-libs-gen|g' $CM
          echo "--- patched refs:"
          grep -n 'blender-libs\|FreeProjects' $CM | head -12

      - name: Arrange libs layout
        run: |
          mkdir -p blender-libs
          tar xzf libs-dl/blender-libs.tgz -C .
          # tar contains build/lib/libbf_*.a -> move up
          if [ -d build/lib ]; then cp build/lib/libbf_*.a blender-libs/; fi
          ls blender-libs | wc -l
          # generated headers (dna/rna) -> single include dir the CMakeLists points at
          mkdir -p blender-libs-gen
          find build -name 'dna*.h' -o -name 'rna*.h' -o -name 'dna.c' -o -name 'dna_verify.c' -o -name 'rna_xr_gen.c' 2>/dev/null | while read f; do
            cp "$f" blender-libs-gen/
          done
          echo "gen files: $(ls blender-libs-gen | wc -l)"
          ls blender-libs-gen | head -20
          # .so libs -> jniLibs
          mkdir -p OBlender/app/src/main/jniLibs/arm64-v8a
          find lib-android_arm64 -name '*.so' -exec cp {} OBlender/app/src/main/jniLibs/arm64-v8a/ \;
          echo "so count: $(ls OBlender/app/src/main/jniLibs/arm64-v8a/ | wc -l)"
          # static deps (jpeg, pugixml, epoxy) referenced by absolute path
          mkdir -p extern-static
          for lib in JPEG/lib/libjpeg.a PugiXML/lib/libpugixml.a Epoxy/lib/libepoxy.a; do
            find lib-android_arm64 -path "*$lib" -exec cp {} extern-static/ \;
          done
          ls extern-static/

      - name: Patch absolute static lib paths in OBlender CMakeLists
        run: |
          CM=OBlender/app/src/main/cpp/CMakeLists.txt
          sed -i 's|lib-android_arm64/JPEG/lib/libjpeg.a|'$GITHUB_WORKSPACE'/extern-static/libjpeg.a|g' $CM
          sed -i 's|lib-android_arm64/PugiXML/lib/libpugixml.a|'$GITHUB_WORKSPACE'/extern-static/libpugixml.a|g' $CM
          sed -i 's|lib-android_arm64/Epoxy/lib/libepoxy.a|'$GITHUB_WORKSPACE'/extern-static/libepoxy.a|g' $CM

      - name: Patch Gradle (jcenter is dead -> mavenCentral)
        run: |
          sed -i 's|jcenter()|mavenCentral()|g' OBlender/build.gradle
          # AGP 4.1.1 needs JDK <= 11, gradle 6.5 wrapper; ensure sdk location
          echo "sdk.dir=$ANDROID_SDK_ROOT" > OBlender/local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_FULL }}" >> OBlender/local.properties

      - name: Build APK
        run: |
          cd OBlender
          chmod +x gradlew
          # repo ships gradle-wrapper.properties but not gradle-wrapper.jar
          mkdir -p gradle/wrapper
          curl -fL -o gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v6.5.0/gradle/wrapper/gradle-wrapper.jar
          ls -la gradle/wrapper/
          ./gradlew :app:assembleRelease --no-daemon --console=plain > gradle.log 2>&1 || { echo "=== GRADLE FAILED (last 80 lines): ==="; tail -80 gradle.log; exit 1; }
          tail -20 gradle.log
          ls -lh app/build/outputs/apk/release/ || true

      - name: Sign APK with debug key (installable)
        run: |
          APK=OBlender/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -f "$APK" ]; then
            BT=$ANDROID_SDK_ROOT/build-tools/30.0.3
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 9999 -noprompt 2>/dev/null || true
            $BT/zipalign -f 4 "$APK" apk-aligned.apk
            $BT/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android \
              --key-pass pass:android --out blender-on-android-v0.0.3-ci.apk apk-aligned.apk
            ls -lh blender-on-android-v0.0.3-ci.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blender-on-android-ci
          path: |
            blender-on-android-v0.0.3-ci.apk
            OBlender/app/build/outputs/apk/**/*.apk
          retention-days: 30
